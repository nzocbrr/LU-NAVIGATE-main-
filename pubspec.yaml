name: lu_navigate
description: Laguna University campus companion application converted from Expo React Native to Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  pdfrx: ^2.4.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/campus_map.png
